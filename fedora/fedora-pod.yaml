apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedora
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fedora
  template:
    metadata:
      labels:
        app: fedora
    spec:
      containers:
        - name: fedora
          image: fedora:latest
          commands:
            - "sleep"
            - "96000"
